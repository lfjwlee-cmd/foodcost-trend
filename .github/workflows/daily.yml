name: Daily Trend Menu Report

on:
  schedule:
    # 21:30 UTC = 06:30 KST. GitHub's scheduler can run a few minutes late
    # under load, so treat this as "around 06:30", not to the second.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "특정 날짜로 실행 (YYYY-MM-DD, 비우면 어제)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp

      - name: Collect
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          PYTHONIOENCODING: utf-8
        run: python scripts/build.py

      # Quality gate. A hard failure stops the job here, so docs/ is never
      # overwritten and yesterday's published page stays live.
      - name: Verify
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/verify.py

      - name: Render
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/render.py

      - name: Commit and push if changed
        run: |
          git config user.name "trend-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Trend menu report $(TZ=Asia/Seoul date +%F)"
          git push
