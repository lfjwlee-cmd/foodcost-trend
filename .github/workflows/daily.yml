name: Daily Trend Menu Report

on:
  schedule:
    # Target: the report is up sometime in the morning, KST. A specific minute
    # is not promised, because this scheduler cannot deliver one.
    #
    # Measured on this repo, every scheduled run started late:
    #   set 06:30 -> ran 08:29 / 08:10 / 08:21   (+1h40m .. +1h59m)
    #   set 04:20 -> ran 07:33                   (+3h13m)
    # Moving the cron earlier does not fix it; the +3h13m was the earliest
    # setting. Free-tier scheduled jobs are queued behind paid load, so the
    # delay is outside this repo's control. Firing at 19:20 UTC (04:20 KST)
    # puts the usual arrival at 06:00-07:30 and the worst seen at 07:33.
    #
    # Running early is harmless: the target date comes from the KST clock at
    # run time, so it resolves to the previous calendar day whether the job
    # starts at 04:20 or slips to 08:00. Odd minutes are less congested.
    - cron: "20 19 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "특정 날짜로 실행 (YYYY-MM-DD, 비우면 어제)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp is only the local/no-key fallback. On GitHub runners YouTube
      # answers per-video requests with "Sign in to confirm you're not a bot"
      # (verified: 40/40 blocked), so CI needs the official API key.
      - name: Check API key
        run: |
          if [ -z "${{ secrets.YOUTUBE_API_KEY }}" ]; then
            echo "::error::YOUTUBE_API_KEY secret is not set. Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
          PYTHONIOENCODING: utf-8
        run: python scripts/build.py

      # Quality gate. A hard failure stops the job here, so docs/ is never
      # overwritten and yesterday's published page stays live.
      - name: Verify
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          PYTHONIOENCODING: utf-8
        run: python scripts/verify.py

      - name: Render
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          PYTHONIOENCODING: utf-8
        run: python scripts/render.py

      - name: Commit and push if changed
        run: |
          git config user.name "trend-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Trend menu report $(TZ=Asia/Seoul date +%F)"
          git push
